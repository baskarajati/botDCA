services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: botdca
      POSTGRES_USER: botdca
      POSTGRES_PASSWORD: botdca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botdca -d botdca"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - botdca_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  botdca_pgdata:
