services:
  api:
    build:
      context: .
      args:
        BOTDCA_UID: ${BOTDCA_UID:-10001}
        BOTDCA_GID: ${BOTDCA_GID:-10001}
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: botdca
      POSTGRES_USER: botdca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botdca}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botdca -d botdca"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - botdca_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  botdca_pgdata:
