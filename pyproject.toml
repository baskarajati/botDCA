[project]
name = "botdca"
version = "0.1.0"
description = "Long-only geometric DCA trading bot for Bybit perpetuals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pybit>=5.11,<6",
  "cryptography>=45,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "httpx>=0.28,<0.29",
]

[project.scripts]
botdca-backtest = "botdca.backtest_cli:main"
botdca-compare-export = "botdca.trader_compare_cli:main"
botdca-profile-export = "botdca.historical_profile_cli:main"
botdca-validate-strategy = "botdca.historical_validation_cli:main"
botdca-calibrate-strategy = "botdca.calibration_cli:main"
botdca-analyze-risk = "botdca.historical_risk_cli:main"
botdca-identify-entry = "botdca.entry_identification_cli:main"
botdca-test-trigger-reference = "botdca.trigger_reference_experiment_cli:main"
botdca-audit-second-level = "botdca.second_level_audit_cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["botdca*"]

[tool.setuptools.package-data]
botdca = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["botdca"]
